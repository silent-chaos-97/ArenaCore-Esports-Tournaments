name: arenacore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arenacore
      POSTGRES_PASSWORD: arenacore
      POSTGRES_DB: arenacore
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arenacore']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  # S3-compatible object storage for local dev (production uses real S3).
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: arenacore-evidence,arenacore-assets
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports: ['9090:9090']
    volumes: [s3data:/s3mockroot]

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  s3data:
