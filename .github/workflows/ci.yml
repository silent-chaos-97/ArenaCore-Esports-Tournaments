name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arenacore
          POSTGRES_PASSWORD: arenacore
          POSTGRES_DB: arenacore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arenacore" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: arenacore-evidence,arenacore-assets
        ports: ['9090:9090']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build
      - name: Apply migrations
        run: pnpm db:deploy && pnpm db:seed
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit, property and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tournament simulation
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arenacore
          POSTGRES_PASSWORD: arenacore
          POSTGRES_DB: arenacore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arenacore" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: arenacore-evidence,arenacore-assets
        ports: ['9090:9090']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
